on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [ "opened", "synchronize", "reopened", "review_requested", "ready_for_review" ]
  workflow_dispatch:
name: Test Flatpak packaging
permissions:
  contents: read
jobs:
  gnome-flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        # Updating a runtime renames its old deployment aside. On runners
        # whose Docker overlayfs can't rename directories from an image
        # layer, that fails with "Invalid cross-device link". A volume is
        # not overlay; Docker fills it from the image when the job starts.
        - /var/lib/flatpak
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.amit9838.mousam.flatpak
          manifest-path: io.github.amit9838.mousam.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}
          restore-cache: true

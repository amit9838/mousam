on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
name: Checks
permissions:
  contents: read
jobs:
  checks:
    name: "Build and validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson gettext libglib2.0-dev-bin appstream desktop-file-utils
      - name: Lint (settings in ruff.toml)
        run: pipx run 'ruff==0.15.*' check src
      - name: Check Python syntax
        run: python3 -m py_compile src/*.py
      # Validates the desktop file, appdata and gschema (see data/meson.build)
      - name: Build and run Meson tests
        run: |
          meson setup builddir
          meson test -C builddir --print-errorlogs

name: mousam
adopt-info: mousam
grade: stable
confinement: strict
base: core26
platforms:
  amd64:
  arm64:

parts:
  python-deps:
    # requests from the Ubuntu archive. The python
    # plugin can't find an interpreter on core26 with the gnome extension.
    plugin: nil
    stage-packages:
      - python3-requests
    prime:
      - usr/lib/python3/dist-packages

  mousam:
    # The checkout this file is in, so CI and the store build the same code.
    source: .
    plugin: meson
    meson-parameters: [ --prefix=/snap/mousam/current/usr ]
    override-build: |
      craftctl default
      sed -e '1c#!/usr/bin/env python3' -i ${CRAFT_PART_INSTALL}/snap/mousam/current/usr/bin/mousam
    parse-info: [ usr/share/metainfo/io.github.amit9838.mousam.appdata.xml ]
    organize:
      snap/mousam/current: .
    prime:
      - -snap/mousam

slots:
  mousam:
    interface: dbus
    bus: session
    name: io.github.amit9838.mousam

apps:
  mousam:
    command: usr/bin/mousam
    common-id: io.github.amit9838.mousam
    desktop: usr/share/applications/io.github.amit9838.mousam.desktop
    extensions: [ gnome ]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
    plugs:
      - network
